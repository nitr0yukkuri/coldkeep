name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Prepare bundle output directory
        run: mkdir -p tmp

      - name: Build Android JavaScript bundle
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output tmp/index.android.bundle --assets-dest tmp/assets

  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Configure Android NDK path
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust inference libraries
        shell: pwsh
        run: .\rust\build_android.ps1 -Architectures arm64-v8a,x86_64

      - name: Verify Rust libraries exist
        shell: pwsh
        run: |
          $libraries = @(Get-ChildItem -LiteralPath android/app/src/main/jniLibs -Filter libcoldkeep_ml.so -Recurse)
          if ($libraries.Count -lt 2) {
            throw 'Expected arm64-v8a and x86_64 Rust libraries were not generated.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Create ephemeral preview signing key
        shell: bash
        run: |
          preview_store_file="$RUNNER_TEMP/coldkeep-preview.jks"
          preview_password="$(openssl rand -hex 32)"
          keytool -genkeypair -v \
            -keystore "$preview_store_file" \
            -storepass "$preview_password" \
            -keypass "$preview_password" \
            -alias coldkeep-preview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=ColdKeep CI Preview,OU=ColdKeep,O=ColdKeep,C=JP"
          {
            echo "COLDKEEP_PREVIEW_STORE_FILE=$preview_store_file"
            echo "COLDKEEP_PREVIEW_STORE_PASSWORD=$preview_password"
            echo "COLDKEEP_PREVIEW_KEY_ALIAS=coldkeep-preview"
            echo "COLDKEEP_PREVIEW_KEY_PASSWORD=$preview_password"
          } >> "$GITHUB_ENV"

      - name: Assemble standalone preview APK
        working-directory: android
        run: bash ./gradlew :app:assemblePreview --no-daemon --console=plain

      - name: Record preview APK checksum
        shell: pwsh
        run: |
          Get-FileHash -LiteralPath android/app/build/outputs/apk/preview/app-preview.apk -Algorithm SHA256 |
            Format-List | Out-File -Encoding utf8 android/app/build/outputs/apk/preview/app-preview.apk.sha256.txt

      - name: Upload standalone preview APK
        uses: actions/upload-artifact@v4
        with:
          name: coldkeep-preview-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/preview/app-preview.apk
            android/app/build/outputs/apk/preview/app-preview.apk.sha256.txt
          if-no-files-found: error
          retention-days: 14

  submission-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install root dependencies
        run: npm ci

      - name: Install Expo Go dependencies
        working-directory: expo-go
        run: npm ci

      - name: Install ML dependencies
        run: python -m pip install --disable-pip-version-check numpy

      - name: Verify submission source and exports
        shell: pwsh
        run: .\scripts\verify-submission.ps1 -SkipAndroid

      - name: Upload verified source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: coldkeep-u22-source-${{ github.sha }}
          path: output/ColdKeep-U22-source.zip
          if-no-files-found: error
          retention-days: 14

  python-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML dependencies
        run: python -m pip install --disable-pip-version-check numpy

      - name: Test feature extraction and shake pilot safeguards
        run: python -m unittest discover -s ml -p 'test_*.py'

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/coldkeep_ml/Cargo.toml -- --check

      - name: Test inference core
        run: cargo test --manifest-path rust/coldkeep_ml/Cargo.toml

  expo-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: expo-go
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            expo-go/package-lock.json

      - name: Install root dependencies for shared source type check
        working-directory: .
        run: npm ci

      - name: Install Expo Go companion dependencies
        run: npm ci

      - name: Type check Expo Go companion
        run: npm run typecheck

      - name: Export iOS and Android bundles
        run: |
          npx expo export --platform ios
          npx expo export --platform android
