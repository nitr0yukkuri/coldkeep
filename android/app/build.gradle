apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Bundle the Ionicons font used by the React Native tab and empty-state icons.
project.ext.vectoricons = [
    iconFontNames: ['Ionicons.ttf']
]
apply from: file('../../node_modules/react-native-vector-icons/fonts.gradle')

react {
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()
def jscFlavor = 'org.webkit:android-jsc:+'

// Release builds must be signed with a private key supplied by the build
// environment. Never fall back to the shared Android debug keystore.
def releaseStoreFile = System.getenv('COLDKEEP_RELEASE_STORE_FILE') ?: findProperty('COLDKEEP_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('COLDKEEP_RELEASE_STORE_PASSWORD') ?: findProperty('COLDKEEP_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('COLDKEEP_RELEASE_KEY_ALIAS') ?: findProperty('COLDKEEP_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('COLDKEEP_RELEASE_KEY_PASSWORD') ?: findProperty('COLDKEEP_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { value -> value != null && !value.toString().trim().isEmpty() }

// Preview artifacts are standalone review builds, not production releases.
// CI creates an ephemeral keystore for each run; no private signing material
// is committed or reused between builds.
def previewStoreFile = System.getenv('COLDKEEP_PREVIEW_STORE_FILE') ?: findProperty('COLDKEEP_PREVIEW_STORE_FILE')
def previewStorePassword = System.getenv('COLDKEEP_PREVIEW_STORE_PASSWORD') ?: findProperty('COLDKEEP_PREVIEW_STORE_PASSWORD')
def previewKeyAlias = System.getenv('COLDKEEP_PREVIEW_KEY_ALIAS') ?: findProperty('COLDKEEP_PREVIEW_KEY_ALIAS')
def previewKeyPassword = System.getenv('COLDKEEP_PREVIEW_KEY_PASSWORD') ?: findProperty('COLDKEEP_PREVIEW_KEY_PASSWORD')
def hasPreviewSigning = [previewStoreFile, previewStorePassword, previewKeyAlias, previewKeyPassword]
    .every { value -> value != null && !value.toString().trim().isEmpty() }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.anonymous.coldkeep'
    defaultConfig {
        applicationId 'com.anonymous.coldkeep'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.0.1"
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        preview {
            if (hasPreviewSigning) {
                storeFile file(previewStoreFile)
                storePassword previewStorePassword
                keyAlias previewKeyAlias
                keyPassword previewKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
        preview {
            initWith release
            matchingFallbacks = ['release']
            if (hasPreviewSigning) {
                signingConfig signingConfigs.preview
            }
            minifyEnabled false
            shrinkResources false
            crunchPngs false
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Keep debug builds usable for reviewers while refusing unsigned Release or
// Preview artifacts. Throwing in buildTypes configuration would also make
// :app:assembleDebug fail, so the requested task names are checked here.
gradle.taskGraph.whenReady { graph ->
    // `initWith release` adds release-named resource tasks to the preview
    // graph. Inspect only the user's requested task names so preview builds
    // do not accidentally require production credentials.
    def requestedTaskNames = gradle.startParameter.taskNames.collect {
        it.toLowerCase(Locale.ROOT)
    }
    def releaseRequested = requestedTaskNames.any { name ->
        name.contains('release') && !name.contains('preview')
    }
    def previewRequested = requestedTaskNames.any { name ->
        name.contains('preview')
    }
    if (!hasReleaseSigning && releaseRequested) {
        throw new GradleException(
            'Release signing is not configured. Set COLDKEEP_RELEASE_STORE_FILE, ' +
            'COLDKEEP_RELEASE_STORE_PASSWORD, COLDKEEP_RELEASE_KEY_ALIAS, and ' +
            'COLDKEEP_RELEASE_KEY_PASSWORD.'
        )
    }
    if (!hasPreviewSigning && previewRequested) {
        throw new GradleException(
            'Preview signing is not configured. Set COLDKEEP_PREVIEW_STORE_FILE, ' +
            'COLDKEEP_PREVIEW_STORE_PASSWORD, COLDKEEP_PREVIEW_KEY_ALIAS, and ' +
            'COLDKEEP_PREVIEW_KEY_PASSWORD.'
        )
    }
}

["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    for (i in 0..<options.size()) options[i] = options[i].trim();
    options -= ""
    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core:1.13.1")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }
    if (isWebpEnabled) {
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
