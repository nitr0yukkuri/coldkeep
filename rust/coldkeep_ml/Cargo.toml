[package]
name = "coldkeep_ml"
version = "0.1.0"
edition = "2021"
description = "ColdKeep on-device audio feature extraction and inference"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
